server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # In production, /api should be routed to the `knowly` backend by a
    # reverse proxy/gateway (e.g. ingress, load balancer) — adjust the
    # `proxy_pass` below to match the deploy environment's topology.
    # location /api/ {
    #     proxy_pass http://knowly:8080/api/;
    # }
}
