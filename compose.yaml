x-security-defaults: &security-defaults
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

services:
  grafana-lgtm:
    <<: *security-defaults
    image: 'grafana/otel-lgtm:0.29.2'
    tmpfs:
      - /tmp
      - /data
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/3000"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g

  mailhog:
    <<: *security-defaults
    image: 'mailhog/mailhog:v1.0.1'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '1025']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m

  pgvector:
    <<: *security-defaults
    image: 'pgvector/pgvector:pg18'
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}'
      - 'POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    labels:
      - 'org.springframework.boot.service-connection=postgres'
    volumes:
      - pgvector-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m

  rabbitmq:
    <<: *security-defaults
    image: 'rabbitmq:4.3-management'
    user: '999:999'
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      - 'RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}'
      - 'RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m

  redis:
    <<: *security-defaults
    image: 'redis:8.8'
    user: '999:999'
    command:
      - 'redis-server'
      - '--requirepass'
      - '${REDIS_PASSWORD:?REDIS_PASSWORD is required}'
      - '--save'
      - '""'
    labels:
      # spring-boot-docker-compose's auto-detected connection details for redis never read a
      # password (it only ever builds host:port), so without this label it silently creates a
      # passwordless connection that wins over spring.data.redis.password in application.yaml —
      # every session write then fails with NOAUTH. This label makes Spring Boot ignore the
      # service entirely for connection-detection, so our explicit property config is used.
      - 'org.springframework.boot.ignore=true'
    read_only: true
    tmpfs:
      - /data
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  # MinIO's own entrypoint never chowns its data directory (unlike rabbitmq's, which is why
  # that service alone gets CHOWN/SETUID/SETGID) — it just chroots into the target user. The
  # image's /data is root-owned, so a fresh named volume (which inherits that ownership on
  # first mount) is unwritable by the non-root `user: 1000:1000` below, and with cap_drop: ALL
  # minio itself has no way to fix it. This one-shot init service does it once, as root, with
  # only the CHOWN capability restored, before minio ever starts.
  minio-init-permissions:
    <<: *security-defaults
    image: 'busybox:1.37'
    user: root
    cap_add:
      - CHOWN
    restart: 'no'
    command: ['chown', '-R', '1000:1000', '/data']
    volumes:
      - minio-data:/data

  minio:
    <<: *security-defaults
    image: 'minio/minio:RELEASE.2025-04-08T15-41-24Z'
    user: '1000:1000'
    command: ['server', '/data']
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}'
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:9000:9000'
    networks:
      - knowly-net
    depends_on:
      minio-init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

networks:
  knowly-net:
    driver: bridge

volumes:
  pgvector-data:
  rabbitmq-data:
  minio-data:
