x-security-defaults: &security-defaults
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

services:
  grafana-lgtm:
    <<: *security-defaults
    image: 'grafana/otel-lgtm:0.28.0'
    tmpfs:
      - /tmp
      - /data
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/3000"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g

  pgvector:
    <<: *security-defaults
    image: 'pgvector/pgvector:pg18'
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}'
      - 'POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    labels:
      - 'org.springframework.boot.service-connection=postgres'
    volumes:
      - pgvector-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5433:5432'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m

  postgres:
    <<: *security-defaults
    image: 'postgres:18'
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}'
      - 'POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m

  rabbitmq:
    <<: *security-defaults
    image: 'rabbitmq:4.3-management'
    user: '999:999'
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      - 'RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}'
      - 'RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m

  redis:
    <<: *security-defaults
    image: 'redis:8.8'
    user: '999:999'
    command:
      - 'redis-server'
      - '--requirepass'
      - '${REDIS_PASSWORD:?REDIS_PASSWORD is required}'
      - '--save'
      - '""'
    read_only: true
    tmpfs:
      - /data
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - knowly-net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

networks:
  knowly-net:
    driver: bridge

volumes:
  pgvector-data:
  postgres-data:
  rabbitmq-data:
