gg:
  jte:
    development-mode: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: knowly
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

knowly:
  mail:
    from: no-reply@conectabyte.com.br
  auth:
    login-code:
      length: 6
      ttl: 10m
      resend-cooldown: 30s
    one-time-password:
      length: 12
      ttl: 15d
    lockout:
      max-attempts: 3
      duration: 15m
      abuse-request-threshold: 5
      abuse-duration: 1h
    captcha:
      velocity-threshold: 5
      verify-velocity-threshold: 20
      velocity-window: 5m
      turnstile-secret: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
