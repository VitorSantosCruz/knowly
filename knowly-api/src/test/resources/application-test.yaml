spring:
  data:
    redis:
      password: ''
  datasource:
    hikari:
      # Every distinct Spring test-context configuration keeps its own pool open against
      # the single shared Testcontainers Postgres instance (see TestcontainersConfiguration's
      # Javadoc) until Spring's test-context cache evicts it. Tests run single-threaded per
      # context, so Hikari's 10-connection default is far more than any one context needs and,
      # multiplied across dozens of concurrently-cached contexts, was exhausting Postgres's
      # connection ceiling ("sorry, too many clients already").
      #
      # This number, multiplied by spring.test.context.cache.maxSize (src/test/resources/
      # spring.properties -- can't live here, see that file's comment for why), must stay
      # comfortably under the container's max_connections=300 (see TestcontainersConfiguration)
      # as this suite grows: 20 * 3 = 60, a ~5x margin. The context-cache size (an LRU cache,
      # not the total number of test classes) is what bounds how many contexts can be open
      # concurrently -- adding more test classes does NOT by itself increase that number, only
      # raising either value does. If either number ever needs to go up, re-check this math
      # against max_connections rather than assuming the old margin still holds.
      maximum-pool-size: 3
  flyway:
    placeholders:
      bootstrap-staff-email: bootstrap-test@conectabyte.com

gg:
  jte:
    # Tests must use the templates jte-maven-plugin already precompiled at build time
    # (into target/classes), not main's hot-reload dev mode. Dev mode's on-demand
    # compiler writes generated .java files to a CWD-relative jte-classes/ directory
    # with no per-fork segment, so concurrent Surefire forks (forkCount>1) race on the
    # same files and intermittently corrupt each other's compile. JTE's autoconfig
    # requires exactly one of development-mode/use-precompiled-templates to be true.
    development-mode: false
    use-precompiled-templates: true
  ai:
    openai:
      api-key: sk-test-dummy-0000000000000000000000000000000000000000
    vectorstore:
      pgvector:
        # Explicit dimensions avoid PgVectorStore#afterPropertiesSet calling the real
        # OpenAI embeddings endpoint at context startup just to infer the vector size.
        dimensions: 1536

knowly:
  auth:
    captcha:
      turnstile-secret: test-dummy-turnstile-secret
  identity:
    cpf-rg-encryption-key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    cpf-rg-hmac-key: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
