# spring.test.context.cache.maxSize is read via Spring's SpringProperties
# abstraction (classpath:spring.properties or a JVM system property), not as a
# normal Boot application property -- the cache decides whether to reuse or
# create an ApplicationContext BEFORE that context (and application-test.yaml
# inside it) is even loaded, so it can't live there.
#
# This bounds how many distinct Spring test-context configurations can stay
# open concurrently against the shared Testcontainers Postgres instance (see
# TestcontainersConfiguration's Javadoc) -- it's an LRU cache, so this number
# does NOT grow as more test classes are added, only if this value or the
# per-context Hikari pool size (application-test.yaml) increases. Kept in sync
# with application-test.yaml's comment: 20 * 3 = 60, a ~5x margin under the
# container's max_connections=300.
spring.test.context.cache.maxSize=20
