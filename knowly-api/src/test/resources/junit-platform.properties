# Auto-registers br.com.conectabyte.knowly.DataIsolationExtension (declared via
# META-INF/services/org.junit.jupiter.api.extension.Extension) for every test class in this
# module, so Postgres/Redis state is reset before each test method without every integration
# test class needing its own @ExtendWith. See DataIsolationExtension's Javadoc for why this is
# needed now that Surefire no longer forces a fresh JVM (and thus a fresh Spring test context and
# fresh Testcontainers) per test class.
junit.jupiter.extensions.autodetection.enabled=true
